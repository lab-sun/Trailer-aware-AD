# @package _group_
speed:
  module: actor_state.speed
gnss:
  module: navigation.gnss
image:
  module: camera.rgb
  fov: 90
  width: 256
  height: 256
  location: [3.2, 0.0, 1.15]
  rotation: [0.0, 0.0, 0.0]
  distort_images: False
waypoints:
  module: navigation.waypoint_plan
  steps: 10
control:
  module: actor_state.control
theta:
  module: actor_state.theta
monitor:
  module: camera.rgb
  fov: 90
  width: 640
  height: 360
  location: [-20, 0.0, 20.0]  
  rotation: [0.0, -45.0, 0.0]
  distort_images: False
